<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Proposed UAV recovery-contract decision pipeline</title>
  <desc id="desc">A planned study flows from configured vehicle identity through authority-loss injection, observed native recovery, and recovery-contract calibration. A held-out gate sends useful individualized contracts to neighbor evacuation and sends null results to the global envelope. No study results are shown.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <style>
      .eyebrow{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.8px;fill:#2563a6}
      .heading{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2937}
      .sub{font:400 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526071}
      .label{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2937;text-anchor:middle}
      .small{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526071;text-anchor:middle}
      .branch{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526071}
      .legend{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .edge{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1280" height="640" fill="#f8fafc"/>
  <text x="48" y="48" class="eyebrow">RESEARCH DESIGN · EVIDENCE STATE: PLANNED</text>
  <text x="48" y="91" class="heading">Compose recovery before offboard authority disappears</text>
  <text x="48" y="124" class="sub">Measure a configured vehicle first; individualize only when held-out evidence justifies it.</text>

  <polygon points="68,184 248,184 228,326 48,326" fill="#e7f0fa" stroke="#2563a6" stroke-width="2.5"/>
  <text x="148" y="226" class="label">Configured vehicle</text>
  <text x="148" y="257" class="small">autopilot + firmware</text>
  <text x="148" y="281" class="small">airframe + parameters</text>
  <text x="148" y="305" class="small">recovery intention</text>

  <path d="M258 255 H289" class="edge"/>

  <rect x="300" y="184" width="205" height="142" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="402" y="226" class="label">Authority loss</text>
  <text x="402" y="257" class="small">stop setpoint stream</text>
  <text x="402" y="281" class="small">or companion process</text>
  <text x="402" y="305" class="small">bounded initial state</text>

  <path d="M515 255 H546" class="edge"/>

  <rect x="557" y="184" width="205" height="142" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/>
  <text x="659" y="226" class="label">Observe recovery</text>
  <text x="659" y="257" class="small">mode + authority trace</text>
  <text x="659" y="281" class="small">latency + braking</text>
  <text x="659" y="305" class="small">trajectory + reconnect</text>

  <path d="M772 255 H803" class="edge"/>

  <polygon points="830,184 982,184 1008,255 982,326 830,326 804,255" fill="#e8f5f2" stroke="#0f766e" stroke-width="2.5"/>
  <text x="906" y="226" class="label">Calibrate contract</text>
  <text x="906" y="257" class="small">training traces only</text>
  <text x="906" y="281" class="small">trajectory tube</text>
  <text x="906" y="305" class="small">coverage + volume</text>

  <path d="M1018 255 H1034" class="edge"/>

  <polygon points="1132,174 1232,255 1132,336 1032,255" fill="#fff4d6" stroke="#b7791f" stroke-width="2.5"/>
  <text x="1132" y="225" class="label">Held-out gate</text>
  <text x="1132" y="253" class="small">coverage retained?</text>
  <text x="1132" y="277" class="small">volume reduced?</text>
  <text x="1132" y="301" class="small">inside domain?</text>

  <path d="M1090 326 V385 H907 V418" class="edge"/>
  <text x="1021" y="375" class="branch">PASS</text>
  <rect x="785" y="430" width="245" height="98" rx="22" fill="#e8f5f2" stroke="#0f766e" stroke-width="2.5"/>
  <text x="907" y="468" class="label">Individual tube</text>
  <text x="907" y="497" class="small">reserve recovery volume</text>
  <text x="907" y="519" class="small">neighbors evacuate</text>

  <path d="M1174 326 V418" class="edge"/>
  <text x="1186" y="375" class="branch">NULL / OOD</text>
  <rect x="1052" y="430" width="180" height="98" rx="22" fill="#eef1f4" stroke="#64748b" stroke-width="2.5"/>
  <text x="1142" y="468" class="label">Global envelope</text>
  <text x="1142" y="497" class="small">abstain from</text>
  <text x="1142" y="519" class="small">individualization</text>

  <line x1="48" y1="574" x2="1232" y2="574" stroke="#d7dde5"/>
  <text x="48" y="605" class="legend">Shape encodes role · dashed border = intervention · amber diamond = decision · no simulation, HITL, or flight result is shown</text>
</svg>
