name: repository-contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependency
        run: python -m pip install -r requirements.txt
      - name: Check research repository contract
        run: python scripts/check_repo_contract.py
      - name: Check derived artifacts and the canonical export audit
        run: |
          python scripts/acquisition_ledger.py --check
          python scripts/reference_coverage.py --check
          python evidence/task-2026-09-09/rerun_search.py --audit evidence/task-2026-09-11-public/database-export.json > /dev/null
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check README links, identity and negative controls
        run: |
          python tools/check_presentation.py . "UAV Failsafe Composition" uav-failsafe-composition
          python tools/test_presentation.py
